# ============================================================
# 鸣鹤 (MingHe) SIP Server — 配置模板
# ============================================================
#
# 使用前请复制此文件到 config/ 目录:
#   cp config.template.toml config/config.toml
#
# 然后根据实际环境修改配置值。
# 带 [必填] 标记的项必须根据实际情况修改。
# ============================================================

[server]
# 监听地址（容器内建议保持 0.0.0.0）
listen_addr = "0.0.0.0"

# SIP TLS 端口 (SIPS 标准端口)
sip_port = 5061

# [必填] 服务器域名或 IP 地址
# 用于 SIP URI、TLS 证书生成和 Digest 认证的 realm
# 示例:
#   域名模式: host = "sip.example.com"
#   IP 模式:  host = "192.168.1.100"
host = "minghe.local"

[extensions]
# 分机号码范围（含起止）
range_start = 1000
range_end = 2000

# [必填] 所有分机的默认密码
# 未在 [passwords] 中单独配置的分机使用此密码
# ⚠️ 请务必修改为强密码！
default_password = "CHANGE_ME_TO_A_STRONG_PASSWORD"

[tls]
# TLS 证书路径
# 留空 = 自动生成自签名证书（推荐内网使用）
# 指定路径 = 使用外部证书（推荐生产环境）
#
# 自签名证书模式:
#   cert_path = ""
#   key_path = ""
#   证书将自动生成到 certs/ 目录，并在到期前 30 天自动续期
#
# 外部证书模式:
#   cert_path = "/app/certs/fullchain.pem"
#   key_path = "/app/certs/privkey.pem"
#   请自行管理证书更新（如使用 certbot）
cert_path = ""
key_path = ""

[media]
# RTP 中继端口范围
# 每通通话占用 2 个 UDP 端口（主叫侧 + 被叫侧）
# 端口数量 = (rtp_port_end - rtp_port_start) / 2 = 最大并发通话数
# 防火墙、云安全组、容器端口映射必须开放相同的 UDP 端口范围。
# 只支持 TCP/HTTP 转发、随机外部端口或无法开放 UDP 端口范围的平台不适合部署本服务。
# 默认 20000-20020 支持约 10 通并发。不要在小 VPS 上默认映射 20000-30000，
# Docker 创建上万个 UDP 端口映射时可能卡死。
rtp_port_start = 20000
rtp_port_end = 20020

# [必填] 服务器公网/内网 IP（用于 SDP 中的媒体地址）
# 此地址必须是客户端可达的 IP
# 不要留空。Docker、云平台或多网卡环境下自动检测通常会拿到容器内网 IP，
# 导致接听后无声。请填写 Bria、Linkvil 等客户端能访问到的公网或内网 IP。
media_addr = "192.168.1.100"

# ============================================================
# IP 封锁（黑名单）
# ============================================================
# 注册/认证失败计数与 IP 封锁策略。同一来源 IP 在统计窗口内累计失败达到
# 阈值后会被临时封锁并递增退避（默认 1/10/60 分钟，封顶可配），到期自动解封，
# 无需重启；窗口外的失败自动过期，认证成功立即清除失败计数与退避等级，
# 封锁期内真实用户持正确凭据注册可立即解封（认证成功提前解封），而封锁期内
# 的认证失败不会延长封锁（攻击者无法用错误凭据让封锁无限期）。
# 未认证 INVITE 走独立限速，不进入封锁表——攻击者无法仅靠发未认证请求封出口。
# 可完全关闭，也可调整各项参数，无需改代码或重新编译。
# 所有字段均有默认值，即使省略整个 [ip_block] 段也能正常启动。
[ip_block]
# 是否启用 IP 封锁与未认证 INVITE 限速
#   true  = 启用（默认）
#   false = 完全关闭：不计数、不封锁、不限速，所有来源均可进入认证流程
enabled = true
# 封锁阈值：统计窗口内同一 IP 累计失败达到该次数即被封锁
max_failures = 5
# 失败计数统计窗口（秒）：窗口外的失败自动过期，避免合法用户被长期累计误伤
window_secs = 600
# 失败计数表（failed_ips）最大条目数，防止攻击者用海量不同 IP 撑爆内存
# 达到上限时优先清理过期条目，仍满则清空失败表（丢计数换取内存安全）
max_failed_ips = 100000
# 封锁表（blocked_ips）最大条目数，达到上限后不再新增封锁（内存保护，降级为仅告警）
max_blocked_ips = 50000

# ---- 未认证 INVITE 单独限速（与密码失败完全隔离，不进入封锁表）----
# 未认证 INVITE 每 invite_window_secs 窗口达到 invite_limit 次后，冷却
# invite_cooldown_secs 秒；冷却期内直接拒绝。
invite_limit = 10
invite_window_secs = 60
invite_cooldown_secs = 60

# ---- 递增退避（临时封锁，到期自动解封）----
# 第 n 次封锁时长 = ban_base_secs * ban_factor^(n-1)，封顶于 max_ban_secs。
# 例：默认 1 / 10 / 60 分钟；最长封锁可配到 30 天（max_ban_secs = 2592000）。
ban_base_secs = 60
ban_factor = 10
max_ban_secs = 3600

# ---- 白名单（可信 IP / CIDR，可选）----
# 命中白名单的来源不计数、不封锁、不限速。适用于企业出口网段等可信源；
# 配置 30 天级长封锁时，务必把可信出口加入白名单。
# 格式：IP（"192.168.1.100"）或 CIDR（"10.0.0.0/8"、"2001:db8::/32"）
# whitelist = ["10.0.0.0/8", "192.168.1.100"]

# ============================================================
# 分机独立密码（可选）
# ============================================================
# 为特定分机设置独立密码，覆盖 default_password
# 格式: 分机号 = "密码"
# 未列出的分机使用上方 default_password
#
# 示例:
[passwords]
# 1001 = "velox@2026"
# 1002 = "alice@2026"
# 1003 = "bob@2026"
