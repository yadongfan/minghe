[package]
name = "minghe"
version = "0.1.0"
edition = "2021"
description = "鸣鹤 — 最小化安全 SIP 语音通信服务"
license = "Apache-2.0"
authors = ["MingHe Contributors"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# SIP parsing
rsip = "0.4"
anyhow = "1"

# TLS — 使用 native-tls：Windows 编译走系统 Schannel，Linux 走系统 OpenSSL。
# 原因：HX4G 等老式 VoIP 网关的 ClientHello 缺 signature_algorithms 扩展，
# 而 rustls 0.23 强制要求该扩展（SignatureAlgorithmsExtensionRequired）导致无法握手；
# OpenSSL 按 RFC 5246 兼容缺省签名算法，是接入此类设备的唯一可靠途径。
# Linux 部署需要在 Dockerfile 中安装 libssl-dev（构建）与 libssl3（运行）。
tokio-native-tls = "0.3"
native-tls = "0.2"
rcgen = { version = "0.13", features = ["default"] }
time = "0.3"

# Crypto for SRTP & Digest auth
aes = "0.8"
ctr = "0.9"
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
# RFC 7714 AEAD_AES_128_GCM SRTP 套件
aes-gcm = "0.10"

# Serialization & config
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Utilities
bytes = "1"
uuid = { version = "1", features = ["v4"] }
# CIDR/IP 网段解析与匹配（白名单）
ipnet = "2"

# Linux（OpenSSL 后端）上将传统 PKCS#1 私钥转换为 PKCS#8 所需。
# 不在 Windows 编译（Windows 走 Schannel，无需该转换能力）。
[target.'cfg(not(windows))'.dependencies]
openssl = "0.10"
